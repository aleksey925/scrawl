{{define "site.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="scrawl">
{{range .Bars}}<meta name="theme-color" content="{{.Color}}" media="{{.Media}}">
{{end}}<title>{{.Title}}</title>
<link rel="icon" href="{{.Assets}}/favicon.svg" type="image/svg+xml">
<script src="{{.Assets}}/boot.js"></script>
<link rel="stylesheet" href="{{.Assets}}/chroma.css">
<link rel="stylesheet" href="{{.Assets}}/site.css">
<script defer src="{{.Assets}}/tree.js"></script>
<script defer src="{{.Assets}}/site.js"></script>
</head>
<body>
<script type="application/json" data-scrawl="page">{{.Data}}</script>
<div id="scrawl-app-root"></div>
<main data-scrawl-static>
<nav aria-label="Path"><ol class="scrawl-static-crumbs">{{range .Crumbs}}<li>{{if .Href}}<a href="{{.Href}}">{{.Title}}</a>{{else}}{{.Title}}{{end}}</li>{{end}}</ol></nav>
{{with .HTML}}<article class="markdown-document">
{{trust .}}
</article>
{{end}}{{with .Entries}}<ul class="scrawl-static-list">
{{range .}}<li><a href="{{.Href}}">{{.Title}}</a></li>
{{end}}</ul>
{{end}}</main>
</body>
</html>
{{end}}
