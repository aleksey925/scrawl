name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # a tag points at a commit, not a branch, so without this check a tag pushed
  # from a dev branch would take over latest on GitHub and in the registry
  latest:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is a stable release from master
        id: check
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master && [[ "$GITHUB_REF_NAME" != *-* ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    needs: latest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          MAKE_LATEST: ${{ needs.latest.outputs.latest }}

  docker:
    needs: latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # the final stage runs apk and adduser, so the arm64 image needs binfmt
      # on an amd64 runner. only the go build stage escapes emulation, through
      # --platform=$BUILDPLATFORM in the Dockerfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # go cross-compiles inside the Dockerfile, so one runner covers both
      # architectures and no digest merge step is needed. an empty line in tags
      # is skipped by the action, which is what drops latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.latest.outputs.latest == 'true' && 'ghcr.io/aleksey925/scrawl:latest' || '' }}
            ghcr.io/aleksey925/scrawl:${{ github.ref_name }}
          build-args: |
            CI=github
            GIT_BRANCH=${{ github.ref_name }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
