{{/*
Outline of the current document. The page hands over the headings the rail
lists and nothing else, so a level that is not rendered here cannot make the
rail appear either.
*/}}

{{define "toc"}}
<nav class="toc" aria-label="On this page">
    <p class="toc-title" id="toc-title">On this page</p>
    <ul class="toc-list">
        {{range .TOC}}
            <li class="toc-item toc-l{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>
        {{end}}
    </ul>
    <a class="toc-top" href="#main" data-back-to-top>
        <svg class="icon" aria-hidden="true"><use href="#icon-arrow-up"></use></svg>
        <span>Back to top</span>
    </a>
</nav>
{{end}}
