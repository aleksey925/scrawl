# Synology example. Copy this file to the NAS, adjust the volume path, the
# `user:` line and AUTH_USERS, then `docker compose up -d`. Container Manager ->
# Project -> "create docker-compose.yml" takes the same file.
#
# There is no `build:` section on purpose: the NAS has no source tree, so a
# build would fail. The image is pulled from ghcr.io, make it a public package
# or `docker login ghcr.io` on the NAS first. Build it yourself with
# `make docker` / `make docker-push` from a checkout.
services:
  mdserver:
    image: ghcr.io/aleksey925/mdserver:master
    container_name: mdserver
    hostname: mdserver
    restart: unless-stopped

    ports:
      # host:container. DSM already uses 5000, 5001 and often 8080, so change
      # the left number if the container refuses to start with "port is
      # already allocated". Keep the right number in step with LISTEN below
      - "8080:8080"

    volumes:
      - /volume1/docs/knowledge-base:/kb
      # small state volume for the generated session key. it must not live
      # under /kb, otherwise it shows up in the tree, in the search index and
      # in every backup of the knowledge base
      - mdserver-data:/data

    # THE ONE LINE THAT USUALLY BREAKS A FIRST RUN.
    # The image runs as uid 1001, the /kb share belongs to a DSM user, and a
    # uid that does not own the share cannot write to it: every save then comes
    # back as "forbidden" while reading keeps working. Run `id <dsm-user>` over
    # ssh on the NAS and put the numbers here (1026:100 is a typical pair),
    # or leave it commented out and add READ_ONLY=true below.
    # user: "1026:100"

    environment:
      - TZ=Europe/Nicosia
      - ROOT=/kb
      - LISTEN=:8080
      - TITLE=Knowledge Base
      # user:bcryptHash pairs, get a hash with
      #   docker run --rm ghcr.io/aleksey925/mdserver:master --gen-hash 'my-password'
      # In THIS file every literal dollar has to be doubled, because compose
      # expands $VARS: a hash printed as $2a$10$xyz is written $$2a$$10$$xyz.
      # In Container Manager's environment table (the one with a Name and a
      # Value column) values are taken literally, so paste the hash unchanged
      # with single dollars. Getting it wrong is not silent: the server refuses
      # to start and names the problem.
      - AUTH_USERS=alex:$$2a$$10$$REPLACE_ME
      # cookie signing key. leave it empty to have one generated and kept in
      # AUTH_SECRET_FILE, which is the simpler option; set it only to share the
      # key with another instance
      - AUTH_SECRET=
      - AUTH_SECRET_FILE=/data/session.key
      - AUTH_TTL=720h
      # Secure flag of the session cookie: auto, always or never. auto keeps the
      # session working over plain http on the LAN
      - AUTH_SECURE=auto
      - READ_ONLY=false
      - MAX_UPLOAD=20M
      # change detection: auto uses inotify with a periodic rescan behind it.
      # switch to poll when /kb is a network share, where inotify never sees
      # what another client writes
      - WATCH=auto
      - RESCAN=60s
      # only when a reverse proxy in front terminates TLS
      - TRUSTED_PROXY=false

    # the healthcheck (wget on /ping, which needs no auth) comes from the image,
    # so Container Manager shows the health column without any setup here

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mdserver-data:
