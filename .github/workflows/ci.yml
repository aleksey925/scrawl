name: ci

on:
  # examples/data is a fixture the browser suite drives, so its markdown is code
  # here and only the documentation at the top of the tree is skipped
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "e2e/README.md"
      - "img/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "e2e/README.md"
      - "img/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Test
        run: make cover
        env:
          TZ: UTC

      - name: Lint
        run: make lint

      - name: Build
        run: make build

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Rebuild the bundle
        run: make ui

      # the bundle is committed so a release needs no node. that only holds if
      # what is committed is what the source produces
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- server/assets/app; then
            echo "server/assets/app is stale, run 'make ui' and commit the result"
            git diff --stat -- server/assets/app
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Build the binary the suite drives
        run: make build

      # no private corpus checkout here, so the suite falls back to examples/data
      - name: Install playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
