version: 2

project_name: scrawl

before:
  hooks:
    - go run ./internal/gzassets/pack

builds:
  - id: scrawl
    main: ./cmd/scrawl
    binary: scrawl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=gzassets
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.revision={{.Version}}

archives:
  - id: scrawl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

brews:
  - name: scrawl
    repository:
      owner: aleksey925
      name: homebrew-apps
      branch: master
    directory: Formula
    commit_author:
      name: Aleksey Petrunnik
      email: petrunnik.a@gmail.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/aleksey925/scrawl"
    description: "Markdown notes in any browser, from a folder or a git repository"
    license: "MIT"
    skip_upload: '{{ if eq (envOrDefault "MAKE_LATEST" "true") "true" }}false{{ else }}true{{ end }}'
    test: |
      assert_match version.to_s, shell_output("#{bin}/scrawl --version")

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: aleksey925
    name: scrawl
  draft: false
  prerelease: auto
  make_latest: '{{ envOrDefault "MAKE_LATEST" "true" }}'
