version: 2

project_name: scrawl

builds:
  - id: scrawl
    main: .
    binary: scrawl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.revision={{.Version}}

archives:
  - id: scrawl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: aleksey925
    name: scrawl
  draft: false
  prerelease: auto
  make_latest: '{{ envOrDefault "MAKE_LATEST" "true" }}'
