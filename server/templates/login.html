<!DOCTYPE html>
<html lang="en"{{with .Theme.ID}} data-scrawl-theme="{{.}}"{{end}}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    {{range .Theme.BarColors}}<meta name="theme-color" content="{{.Color}}"{{with .Media}} media="{{.}}"{{end}}>
    {{end}}<meta name="scrawl-themes" content="{{.Themes}}">
    <meta name="robots" content="noindex">
    <title>Sign in - {{.SiteTitle}}</title>
    <link rel="icon" href="{{.Favicon}}" type="image/svg+xml">
    {{range .Theme.TouchIcons}}<link rel="apple-touch-icon" href="{{.Href}}"{{with .Media}} media="{{.}}"{{end}}>
    {{end}}
    <link rel="stylesheet" href="{{.AppThemes}}">
    <link rel="stylesheet" href="/static/{{.Version}}/login/login.css">
    <script src="/static/{{.Version}}/login/login.js"></script>
</head>
<body>

<button class="login-theme" type="button" data-theme-toggle data-icon="{{or .Theme.Scheme "auto"}}" aria-label="Theme: {{or .Theme.Name "system"}}">
    <svg class="icon icon-theme-auto" aria-hidden="true"><use href="#icon-auto"></use></svg>
    <svg class="icon icon-theme-light" aria-hidden="true"><use href="#icon-sun"></use></svg>
    <svg class="icon icon-theme-dark" aria-hidden="true"><use href="#icon-moon"></use></svg>
</button>

<main class="login" id="main">
    <form class="login-box" method="post" action="/login">
        {{.Logo}}
        <h1 class="login-title">{{.SiteTitle}}</h1>
        <p class="login-sub">Sign in to read and edit</p>

        {{if .Error}}
            <p class="login-error" role="alert">
                <svg class="icon" aria-hidden="true"><use href="#icon-warn"></use></svg>
                <span>{{.Error}}</span>
            </p>
        {{end}}

        <input type="hidden" name="from" value="{{.From}}">

        <label class="field-label" for="login-username">Username</label>
        <input class="input" id="login-username" type="text" name="username" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>

        <label class="field-label" for="login-password">Password</label>
        <input class="input" id="login-password" type="password" name="password" autocomplete="current-password"
               placeholder="Enter your password" required>

        <button class="btn" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
