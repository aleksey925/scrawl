# Local try-out. Builds the image from this checkout and serves ./kb.
#
#   mkdir -p kb
#   docker compose -f docker-compose.local.yml up --build
#
# Then open http://localhost:8080 and sign in as admin / admin.
#
# To browse an existing knowledge base instead of the empty ./kb:
#
#   KB=~/notes docker compose -f docker-compose.local.yml up --build
#
# For a real deployment use docker-compose.yml, which is the documented one.
services:
  mdserver:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ${KB:-./kb}:/kb
      - mdserver-local-data:/data
    # run as the host user, so files written from the browser belong to you and
    # not to the image's own uid. docker compose leaves ${UID} empty unless the
    # shell exports it, and 1000 is the usual first user on linux
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - AUTH_USERS=admin:admin
      - TZ=UTC

volumes:
  mdserver-local-data:
