name: build

on:
  # examples/data is a fixture the browser suite drives, so its markdown is code
  # here and only the documentation at the top of the tree is skipped
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - "e2e/README.md"
      - "img/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "e2e/README.md"
      - "img/**"

permissions:
  contents: read

jobs:
  test:
    name: test and lint
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: set up toolchains
        uses: jdx/mise-action@v2

      - name: test
        run: make cover
        env:
          TZ: UTC

      - name: lint
        run: make lint

      - name: build
        run: make build

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: set up toolchains
        uses: jdx/mise-action@v2

      - name: build the binary the suite drives
        run: make build

      # no private corpus checkout here, so the suite falls back to examples/data
      - name: install playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: browser suite
        working-directory: e2e
        run: npx playwright test

      - name: upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: docker
    needs: [test, browser]
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # the final stage runs apk and adduser, so the arm64 image needs binfmt
      # on an amd64 runner. only the go build stage escapes emulation, through
      # --platform=$BUILDPLATFORM in the Dockerfile
      - name: set up qemu
        uses: docker/setup-qemu-action@v3

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute image tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${REF_NAME//\//_}"
          if [ "$IS_TAG" = "true" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # go cross-compiles inside the Dockerfile, so one runner covers both
      # architectures and no digest merge step is needed
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CI=github
            GIT_BRANCH=${{ github.ref_name }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
